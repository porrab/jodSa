# The route is idempotent per slot and accepts the whole 12:xx / 22:xx Bangkok hour.
# GitHub may delay scheduled runs; schedules are disabled after 60 days without repo activity.
name: notify-cron

on:
  schedule:
    - cron: '5 5 * * *'
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-cron
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send push reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET Actions secret is empty; configure it before running notify-cron." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" https://jod-sa.vercel.app/api/cron/notify
